services:
  db:
    image: ${REGISTRY:-battle}/classwar-db:${TAG:-latest}
    build: ./db
    environment:
      POSTGRES_USER: battle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-battle}
      POSTGRES_DB: battle
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battle -d battle"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${REGISTRY:-battle}/classwar-backend:${TAG:-latest}
    build: ./backend
    environment:
      DATABASE_URL: postgresql://battle:${POSTGRES_PASSWORD:-battle}@db:5432/battle
      BOT_TOKEN: ${BOT_TOKEN:-}
      SERVICE_KEY: ${SERVICE_KEY:-}
      ADMIN_CODE: ${ADMIN_CODE:-}
      CURATOR_CODE: ${CURATOR_CODE:-}
      DEV_MODE: ${DEV_MODE:-0}
      HEXES_PER_CLASS: ${HEXES_PER_CLASS:-6}
      INCOME_TZ: ${INCOME_TZ:-Asia/Vladivostok}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${REGISTRY:-battle}/classwar-frontend:${TAG:-latest}
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Бот запускается отдельно, потому что ему нужен настоящий токен MAX:
  #   docker compose --profile bot up
  bot:
    image: ${REGISTRY:-battle}/classwar-bot:${TAG:-latest}
    build: ./bot
    profiles: ["bot"]
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      SERVICE_KEY: ${SERVICE_KEY:-}
      API_URL: http://backend:8000
      WEBAPP_URL: ${WEBAPP_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: battle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: battle
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battle -d battle"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://battle:${POSTGRES_PASSWORD}@db:5432/battle
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      SERVICE_KEY: ${SERVICE_KEY:?set SERVICE_KEY in .env}
      ADMIN_CODE: ${ADMIN_CODE:?set ADMIN_CODE in .env}
      CURATOR_CODE: ${CURATOR_CODE:?set CURATOR_CODE in .env}
      DEV_MODE: ${DEV_MODE:-0}
      HEXES_PER_CLASS: ${HEXES_PER_CLASS:-6}
      INCOME_TZ: ${INCOME_TZ:-Asia/Vladivostok}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build: ./bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      SERVICE_KEY: ${SERVICE_KEY}
      API_URL: http://backend:8000
      WEBAPP_URL: ${WEBAPP_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Битва Классов</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <div class="hud" id="hud">
    <div class="hud-header">
      <h1>Битва классов</h1>
      <div class="hud-sub" id="buildingName">Загрузка...</div>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">Секторов</span>
        <span class="stat-value" id="hexCount">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Мои</span>
        <span class="stat-value" id="myHexes">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">ОД класса</span>
        <span class="stat-value" id="myBalance">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">Мой класс</span>
        <span class="stat-value" id="myClass" style="font-size:14px">—</span>
      </div>
    </div>

    <div class="status" id="statusLine">Инициализация...</div>

    <div class="legend" id="legend"></div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="attackModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Захват сектора</h2>
        <button class="modal-close" id="closeModal">×</button>
      </div>
      <div class="modal-body">
        <div class="attack-info">
          <div class="info-row"><span class="info-label">Сектор:</span><span class="info-value" id="attackHexId">—</span></div>
          <div class="info-row"><span class="info-label">Владелец:</span><span class="info-value" id="attackOwner">—</span></div>
          <div class="info-row"><span class="info-label">Доход:</span><span class="info-value" id="attackIncome">—</span></div>
          <div class="info-row"><span class="info-label">Расстояние:</span><span class="info-value" id="attackDistance">—</span></div>
          <div class="info-row"><span class="info-label">Множитель:</span><span class="info-value" id="attackMultiplier">—</span></div>
          <div class="info-row"><span class="info-label">Цена:</span><span class="info-value cost-big" id="attackCost">—</span></div>
          <div class="info-row"><span class="info-label">У класса:</span><span class="info-value" id="attackBalance">—</span></div>
        </div>
        <div class="attack-hint">Цена считается сервером и списывается с ОД класса. Чем дальше от ваших секторов — тем дороже.</div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="cancelAttack">Отмена</button>
        <button class="btn-primary" id="confirmAttack">Захватить</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Битва Классов</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <div class="hud" id="hud">
    <div class="hud-header">
      <h1>Битва классов</h1>
      <div class="hud-sub" id="buildingName">Адрес не задан</div>
    </div>

    <div class="search-block">
      <input type="text" id="addressInput" placeholder="Введите адрес здания" autocomplete="off" />
      <button id="searchBtn" class="search-btn">Найти</button>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">Секторов</span>
        <span class="stat-value" id="hexCount">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Размер</span>
        <span class="stat-value" id="hexSize">— м</span>
      </div>
    </div>

    <div class="status" id="statusLine">Введите адрес или нажмите «Разметить корпус»</div>

    <div class="controls">
      <button id="editBtn">Разметить корпус</button>
    </div>

    <div class="legend" id="legend"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>

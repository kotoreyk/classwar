<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Битва Классов</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="map"></div>

  <div class="hud" id="hud">
    <div class="hud-header">
      <h1>Битва классов</h1>
      <div class="hud-sub" id="buildingName">Загрузка...</div>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">Секторов</span>
        <span class="stat-value" id="hexCount">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Мои</span>
        <span class="stat-value" id="myHexes">0</span>
      </div>
    </div>

    <div class="status" id="statusLine">Инициализация...</div>

    <div class="legend" id="legend"></div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="attackModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Атака на сектор</h2>
        <button class="modal-close" id="closeModal">×</button>
      </div>
      <div class="modal-body">
        <div class="attack-info">
          <div class="info-row"><span class="info-label">Сектор:</span><span class="info-value" id="attackHexId">—</span></div>
          <div class="info-row"><span class="info-label">Владелец:</span><span class="info-value" id="attackOwner">—</span></div>
          <div class="info-row"><span class="info-label">Расстояние:</span><span class="info-value" id="attackDistance">—</span></div>
          <div class="info-row"><span class="info-label">Штраф:</span><span class="info-value" id="attackMultiplier">—</span></div>
          <div class="info-row"><span class="info-label">Нужно очков:</span><span class="info-value" id="attackCurrentPoints">—</span></div>
        </div>
        <div class="attack-input-group">
          <label for="attackPointsInput">Ваши очки (ставки за оценки):</label>
          <input type="number" id="attackPointsInput" min="1" placeholder="Введите количество" />
          <div class="attack-hint">Чем дальше от вашей территории — тем больше очков нужно</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="cancelAttack">Отмена</button>
        <button class="btn-primary" id="confirmAttack">Атаковать</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="generator.js"></script>
  <script src="script.js"></script>
</body>
</html>
